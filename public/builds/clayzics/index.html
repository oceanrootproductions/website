<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Clayzics!</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e16;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}  /* CrazyGames mobile rule: a long press must never select text */
  #view{display:block;width:100vw;height:100dvh;touch-action:none}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
    background:#0a0e16;color:#69727f;font:600 15px system-ui,sans-serif;z-index:10;user-select:none}
  #start .spin{width:26px;height:26px;border:3px solid #1d232f;border-top-color:#3d6fd1;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<canvas id="view"></canvas>
<div id="start"><div class="spin"></div>Loading…</div>
<script src="engine.js"></script>
<script type="module" src="js/play.js"></script>
</body></html>
